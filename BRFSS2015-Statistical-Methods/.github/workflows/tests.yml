name: BRFSS validation
on:
  push:
    paths: ['BRFSS2015-Statistical-Methods/**', '.github/workflows/brfss-tests.yml']
  pull_request:
    paths: ['BRFSS2015-Statistical-Methods/**', '.github/workflows/brfss-tests.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    defaults:
      run:
        working-directory: BRFSS2015-Statistical-Methods
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt -r requirements-boosters.txt -r requirements-research-extensions.txt
      - run: python -m pip install -e . --no-deps
      - run: python scripts/verify_environment.py
      - run: python -m compileall -q src src_extensions scripts tests
      - run: ruff check src src_extensions scripts tests
      - run: ruff format --check src src_extensions scripts tests
      - run: python -m pytest
      - run: python -m scripts.validate_notebooks --execute --repeat 2
